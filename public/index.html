<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Valeria - Amiga Virtual</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* Header */
    header { background: #1e293b; padding: 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .avatar-info { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, #ec4899, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .status-text h2 { font-size: 16px; font-weight: 600; }
    .status-text span { font-size: 12px; color: #10b981; }

    /* Chat Area */
    #chat-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #6366f1; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; }
    
    .typing { font-size: 12px; color: #94a3b8; font-style: italic; align-self: flex-start; margin-left: 5px; }

    /* Input Footer */
    footer { padding: 15px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 10px; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 25px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #6366f1; }
    button { background: #6366f1; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #4f46e5; }

    /* Paywall Modal Overlay */
    #paywall-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .paywall-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 20px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .paywall-card h3 { font-size: 22px; margin-bottom: 10px; color: #f43f5e; }
    .paywall-card p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .btn-pay { background: linear-gradient(135deg, #ec4899, #8b5cf6); width: 100%; padding: 14px; border-radius: 30px; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="avatar-info">
      <div class="avatar">V</div>
      <div class="status-text">
        <h2>Valeria</h2>
        <span>🟢 En línea</span>
      </div>
    </div>
  </header>

  <!-- Chat Messages Area -->
  <div id="chat-container"></div>
  <div id="typing-indicator" class="typing hidden">Valeria está escribiendo...</div>

  <!-- Input Bar -->
  <footer>
    <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off" />
    <button id="send-btn">Enviar</button>
  </footer>

  <!-- Paywall Modal -->
  <div id="paywall-modal" class="hidden">
    <div class="paywall-card">
      <h3>👑 Acceso Premium Requerido</h3>
      <p>Para platicar con Valeria necesitas activar tu membresía mensual.</p>
      <button class="btn-pay" id="pay-btn">💳 Suscribirme Ahora</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg && tg.initData) {
      tg.ready();
      tg.expand();
    }

    const socket = io();
    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const paywallModal = document.getElementById('paywall-modal');
    const payBtn = document.getElementById('pay-btn');

    // Inicializar app consultando el estado del usuario
    async function initApp() {
      const initData = tg?.initData || "";

      try {
        const res = await fetch('/api/user-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramInitData: initData })
        });

        const data = await res.json();

        if (data.user) {
          // Autenticar conexión por Socket.io
          socket.emit('autenticar', { telegramInitData: initData });

          if (!data.isSubscribed) {
            paywallModal.classList.remove('hidden');
          } else {
            paywallModal.classList.add('hidden');
          }
        }
      } catch (e) {
        console.error("Error al iniciar la app:", e);
      }
    }

    // Renderizar mensaje
    function appendMessage(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = content;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Enviar mensaje del usuario
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      socket.emit('mensaje_usuario', { texto: text });
      msgInput.value = '';
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // --- BOTÓN DE PAGO ACTUALIZADO PARA MERCADO PAGO ---
    payBtn.addEventListener('click', async () => {
      payBtn.disabled = true;
      payBtn.textContent = 'Generando checkout...';

      try {
        const res = await fetch('/api/crear-preferencia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegramInitData: tg?.initData || ''
          })
        });

        const data = await res.json();

        if (data.init_point) {
          // Si estamos dentro de la Web App de Telegram, abrir enlace externo
          if (tg && tg.initData && tg.openLink) {
            tg.openLink(data.init_point);
          } else {
            window.location.href = data.init_point;
          }
        } else {
          alert('No se pudo generar la preferencia de pago de Mercado Pago');
        }
      } catch (err) {
        console.error('Error procesando pago con Mercado Pago:', err);
        alert('Ocurrió un error al conectar con la pasarela de pago');
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = '💳 Suscribirme Ahora';
      }
    });

    // --- EVENTOS SOCKET.IO SINCRONIZADOS CON EL BACKEND ---
    socket.on('cargar_historial', (messages) => {
      chatContainer.innerHTML = '';
      messages.forEach(m => {
        const role = m.role === 'assistant' || m.role === 'bot' ? 'assistant' : 'user';
        appendMessage(role, m.content);
      });
    });

    socket.on('respuesta_bot', (data) => {
      appendMessage('assistant', data.texto);
    });

    socket.on('typing', (isTyping) => {
      if (isTyping) typingIndicator.classList.remove('hidden');
      else typingIndicator.classList.add('hidden');
      chatContainer.scrollTop = chatContainer.scrollHeight;
    });

    socket.on('status_suscripcion', (data) => {
      if (data.active) {
        paywallModal.classList.add('hidden');
      } else {
        paywallModal.classList.remove('hidden');
      }
    });

    socket.on('error_auth', (msg) => {
      console.warn('Error de autenticación:', msg);
      paywallModal.classList.remove('hidden');
    });

    initApp();
  </script>
</body>
</html>
