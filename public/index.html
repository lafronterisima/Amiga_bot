<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Valeria - Amiga Virtual</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- FontAwesome para 赤conos n赤tidos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      flex-direction: column; 
      height: 100vh;
      height: 100dvh; 
      overflow: hidden; 
    }
    
    /* Header con soporte para Safe Area Top */
    header { 
      background: #1e293b; 
      padding: 15px; 
      padding-top: max(15px, env(safe-area-inset-top));
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      border-bottom: 1px solid #334155; 
      flex-shrink: 0;
    }
    .avatar-info { display: flex; align-items: center; gap: 12px; }
    .avatar { 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #ec4899, #8b5cf6); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 18px; 
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(236, 72, 153, 0.4);
    }
    .status-text h2 { font-size: 16px; font-weight: 600; color: #f8fafc; }
    .status-text span { font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 8px; height: 8px; background-color: #10b981; border-radius: 50%; display: inline-block; }

    /* Contenedor de Chat */
    #chat-container { 
      flex: 1; 
      padding: 15px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      -webkit-overflow-scrolling: touch;
    }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #6366f1; color: #ffffff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; }
    
    .typing { font-size: 12px; color: #94a3b8; font-style: italic; align-self: flex-start; margin-left: 5px; padding: 4px 0; display: flex; align-items: center; gap: 6px; }

    /* Footer con soporte para Safe Area Bottom */
    footer { 
      padding: 12px 15px; 
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      background: #1e293b; 
      border-top: 1px solid #334155; 
      display: flex; 
      gap: 10px; 
      flex-shrink: 0;
      align-items: center;
    }
    input { 
      flex: 1; 
      background: #0f172a; 
      border: 1px solid #334155; 
      padding: 12px 16px; 
      border-radius: 25px; 
      color: #fff; 
      font-size: 16px; 
      outline: none; 
    }
    input:focus { border-color: #6366f1; }
    button { 
      background: #6366f1; 
      color: white; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 25px; 
      font-weight: 600; 
      cursor: pointer; 
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s; 
    }
    button:active { transform: scale(0.96); background: #4f46e5; }

    /* Modal Paywall */
    #paywall-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
    .paywall-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 20px; text-align: center; max-width: 360px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .paywall-icon { font-size: 40px; color: #f43f5e; margin-bottom: 15px; }
    .paywall-card h3 { font-size: 22px; margin-bottom: 10px; color: #f43f5e; }
    .paywall-card p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .btn-pay { background: linear-gradient(135deg, #ec4899, #8b5cf6); width: 100%; padding: 14px; border-radius: 30px; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="avatar-info">
      <div class="avatar">V</div>
      <div class="status-text">
        <h2>Valeria</h2>
        <span><i class="status-dot"></i> En l赤nea</span>
      </div>
    </div>
  </header>

  <!-- Contenedor del Chat -->
  <div id="chat-container"></div>
  <div id="typing-indicator" class="typing hidden">
    <i class="fa-solid fa-circle-notch fa-spin"></i> Valeria est芍 escribiendo...
  </div>

  <!-- Barra de entrada de texto -->
  <footer>
    <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off" />
    <button id="send-btn">
      <span>Enviar</span>
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </footer>

  <!-- Modal Paywall -->
  <div id="paywall-modal" class="hidden">
    <div class="paywall-card">
      <div class="paywall-icon">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h3>Acceso Premium Requerido</h3>
      <p>Para platicar con Valeria necesitas activar tu membres赤a mensual.</p>
      <button class="btn-pay" id="pay-btn">
        <i class="fa-solid fa-credit-card"></i> Suscribirme Ahora
      </button>
    </div>
  </div>

  <script>
    // Inicializaci車n del SDK de Telegram
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const chatContainer = document.getElementById('chat-container');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const paywallModal = document.getElementById('paywall-modal');
    const payBtn = document.getElementById('pay-btn');

    // Conexi車n Socket.io pasando autenticaci車n inicial
    const socket = io({
      auth: {
        telegramInitData: tg?.initData || ''
      },
      transports: ['websocket', 'polling']
    });

    // Auto-scroll al final del chat
    function scrollToBottom() {
      requestAnimationFrame(() => {
        chatContainer.scrollTop = chatContainer.scrollHeight;
      });
    }

    // Inicializar estado del usuario contra el backend
    async function initApp() {
      const initData = tg?.initData || "";

      try {
        const res = await fetch('/api/user-status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telegramInitData: initData })
        });

        if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);

        const data = await res.json();

        if (data.user) {
          // Emitir autenticaci車n por socket
          socket.emit('autenticar', { telegramInitData: initData });

          if (!data.isSubscribed) {
            paywallModal.classList.remove('hidden');
          } else {
            paywallModal.classList.add('hidden');
          }
        } else {
          // Si no hay usuario devuelto, activar pantalla de suscripci車n/bloqueo
          paywallModal.classList.remove('hidden');
        }
      } catch (e) {
        console.error("Error al iniciar la app:", e);
      }
    }

    // Agregar mensaje al contenedor
    function appendMessage(role, content) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.textContent = content;
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    // Enviar mensaje
    function sendMessage() {
      const text = msgInput.value.trim();
      if (!text) return;

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('light');
      }

      appendMessage('user', text);
      socket.emit('mensaje_usuario', { texto: text });
      msgInput.value = '';
    }

    // Escuchadores de eventos UI
    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => { 
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage(); 
      }
    });

    msgInput.addEventListener('focus', () => {
      setTimeout(scrollToBottom, 300);
    });

    // Bot車n de Pago
    payBtn.addEventListener('click', async () => {
      payBtn.disabled = true;
      payBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generando checkout...';

      try {
        const res = await fetch('/api/crear-preferencia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            telegramInitData: tg?.initData || ''
          })
        });

        const data = await res.json();

        if (data.init_point) {
          if (tg && tg.initData && tg.openLink) {
            tg.openLink(data.init_point);
          } else {
            window.location.href = data.init_point;
          }
        } else {
          alert('No se pudo generar la preferencia de pago');
        }
      } catch (err) {
        console.error('Error procesando pago:', err);
        alert('Ocurri車 un error al conectar con la pasarela de pago');
      } finally {
        payBtn.disabled = false;
        payBtn.innerHTML = '<i class="fa-solid fa-credit-card"></i> Suscribirme Ahora';
      }
    });

    // Escuchadores de Socket.io
    socket.on('cargar_historial', (messages) => {
      chatContainer.innerHTML = '';
      messages.forEach(m => {
        const role = m.role === 'assistant' || m.role === 'bot' ? 'assistant' : 'user';
        appendMessage(role, m.content);
      });
      scrollToBottom();
    });

    socket.on('respuesta_bot', (data) => {
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
      appendMessage('assistant', data.texto);
    });

    socket.on('typing', (isTyping) => {
      if (isTyping) typingIndicator.classList.remove('hidden');
      else typingIndicator.classList.add('hidden');
      scrollToBottom();
    });

    socket.on('status_suscripcion', (data) => {
      if (data.active) {
        paywallModal.classList.add('hidden');
      } else {
        paywallModal.classList.remove('hidden');
      }
    });

    socket.on('error_auth', (msg) => {
      console.warn('Error de autenticaci車n:', msg);
      paywallModal.classList.remove('hidden');
    });

    // Garantizar que la app inicie solo cuando el DOM est谷 listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
